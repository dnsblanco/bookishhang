<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookish Hang</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #F9F8F4;
            --card-bg: #ffffff;
            --accent: #2c3e50;
            --highlight: #e67e22;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            color: var(--accent);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1, h2, h3 { 
            font-family: 'Merriweather', serif; 
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }

        /* Card Styles */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 0; 
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .book-card.highlight {
            border: 2px solid var(--highlight);
        }

        .cover-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 0; 
            background-color: #ddd; 
            margin-bottom: 15px;
        }

        .book-info h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
        
        .book-info .author { 
            font-style: normal; 
            margin-bottom: 10px; 
            display: block; 
        }
        
        .book-info .date { font-size: 0.85rem; color: #666; margin-bottom: 15px; display: block; }

        /* Ratings Table */
        .ratings {
            margin-top: auto;
            width: 100%;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        
        .rating-row {
            display: flex;
            align-items: center; 
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px; 
        }

        .reviewer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .headshot {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #ccc;
            transition: transform 0.2s;
        }

        .reviewer-icon {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .reviewer-name { font-weight: bold; }

        .headshot:hover {
            transform: scale(1.1);
        }

        .stars { color: #FA604A; letter-spacing: 2px; }
        
        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 0; 
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .badge-next { background-color: #3498db; }  /* Blue */
        .badge-current { background-color: #e67e22; } /* Orange */
        .badge-read { background-color: #27ae60; }    /* Green */

        /* Photo Strip */
        .photo-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .photo-strip figure {
            margin: 0;
            background: var(--card-bg);
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .photo-strip img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
        }

        .photo-strip figcaption {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

    </style>
</head>
<body>

    <header>
        <h1>📚 Bookish Hang</h1>
        <p>Searching for the secrets of the universe.</p>
    </header>

    <section class="photo-strip">
        <figure>
            <img src="images/park-hang.jpg" alt="Two friends at a park hang with drinks and snacks beside a bed of black-eyed Susans" loading="lazy">
            <figcaption>Bloody Meridians at Cobble Hill Park • Summer 2023</figcaption>
        </figure>
        <figure>
            <img src="images/met-steps.jpg" alt="Two friends sitting on the steps of the Met with a row of art postcards laid out" loading="lazy">
            <figcaption>Postcard Draft at the Met • Fall 2024</figcaption>
        </figure>
    </section>

    <div id="library-section" class="book-grid"></div>

    <script>
        // --- 1. PASTE YOUR GOOGLE SHEET CSV LINK HERE ---
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXKGbQIKMqjBFsjgLwD-jF68_mSGe__F_e1aSn51rURsr1kPLRNtENsGKxMjifJihuT-qlWLYd2ghD/pub?gid=0&single=true&output=csv";

        // --- 2. CONFIGURE REVIEWERS HERE ---
        const reviewers = {
            "Denny": {
                icon: "🥭",
                link: "https://www.goodreads.com/user/show/17181834-denny"
            },
            "Niels": {
                img: "https://images.gr-assets.com/users/1604262185p6/123916193.jpg",
                link: "https://www.goodreads.com/user/show/123916193-niels-joaquin"
            },
            "Ben": {
                icon: "🍑",
                link: "https://www.goodreads.com/user/show/9052633-ben"
            }
        };

        function init() {
            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    renderLibrary(results.data);
                },
                error: function(err) {
                    console.error("Error loading sheet:", err);
                    const el = document.getElementById('library-section');
                    if(el) el.innerHTML = "<p>Error loading books. Check your CSV link.</p>";
                }
            });
        }

        function renderStars(count) {
            if (!count || isNaN(count)) return "-";
            return "★".repeat(Math.round(count)) + "☆".repeat(5 - Math.round(count));
        }

        function createCard(book) {
            let badge = "";
            let highlightClass = "";
            
            // Normalize status text (trim spaces, lowercase)
            const status = book.Status ? book.Status.toLowerCase().trim() : "";

            if (status === "current") {
                badge = `<span class="badge badge-current">Currently Reading</span>`;
                highlightClass = "highlight";
            } else if (status === "next") {
                badge = `<span class="badge badge-next">On Deck</span>`;
            } else if (status === "read") {
                badge = `<span class="badge badge-read">Read</span>`;
            }

            // Handle Images
            const coverImage = book.Cover && book.Cover.startsWith('http') 
                ? book.Cover 
                : 'https://placehold.co/250x350?text=No+Cover';

            // Handle Dates (Start & Finish)
            let dateDisplay = "TBD";
            if (book.Finish) {
                if (book.Start) {
                    dateDisplay = `${book.Start} – ${book.Finish}`;
                } else {
                    dateDisplay = `Finished: ${book.Finish}`;
                }
            } else if (book.Start) {
                dateDisplay = `Started: ${book.Start}`;
            }

            // Generate Ratings HTML
            const ratingsHTML = Object.keys(reviewers).map(name => {
                const config = reviewers[name];
                const score = book[name]; 
                
                return `
                    <div class="rating-row">
                        <div class="reviewer-info">
                            <a href="${config.link}" target="_blank" title="${name}'s Profile">
                                ${config.icon
                                    ? `<span class="reviewer-icon" role="img" aria-label="${name}">${config.icon}</span>`
                                    : `<img src="${config.img}" alt="${name}" class="headshot">`}
                            </a>
                            <span class="reviewer-name">${name}</span>
                        </div>
                        <span class="stars">${renderStars(score)}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="book-card ${highlightClass}">
                    ${badge}
                    <img src="${coverImage}" alt="${book.Title}" class="cover-img" onerror="this.src='https://placehold.co/250x350?text=No+Cover'">
                    <div class="book-info">
                        <h3>${book.Title || "Untitled"}</h3>
                        <span class="author">by ${book.Author || "Unknown"}</span>
                        <span class="date">${dateDisplay}</span>
                    </div>
                    <div class="ratings">
                        ${ratingsHTML}
                    </div>
                </div>
            `;
        }

        function renderLibrary(data) {
            const libraryContainer = document.getElementById('library-section');
            if (!libraryContainer) {
                console.error("Could not find #library-section div");
                return;
            }
            
            // Define Sort Order: 1=Next, 2=Current, 3=Read
            const statusOrder = {
                "next": 1,
                "current": 2,
                "read": 3
            };

            const sortedBooks = data.filter(b => b.Title).sort((a, b) => {
                const sA = a.Status ? a.Status.toLowerCase().trim() : "";
                const sB = b.Status ? b.Status.toLowerCase().trim() : "";

                const orderA = statusOrder[sA] || 99; // 99 pushes unknown status to the bottom
                const orderB = statusOrder[sB] || 99;

                // 1. Sort by Status Priority (Deck -> Current -> Read)
                if (orderA !== orderB) {
                    return orderA - orderB;
                }

                // 2. Secondary Sort: If both are "read", sort by finish date (newest first)
                if (sA === 'read' && sB === 'read') {
                     if (!a.Finish) return 1;
                     if (!b.Finish) return -1;
                     return new Date(b.Finish) - new Date(a.Finish);
                }

                return 0;
            });

            // Render All Cards
            libraryContainer.innerHTML = sortedBooks.map(createCard).join('');
        }

        // Run the function
        init();
    </script>
</body>
</html>
